name: Build Cross-Architecture Binaries (macOS, Windows, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            artifact_name: iPhoneBackupStudio-macOS-arm64
          - os: macos-13
            arch: x86_64
            artifact_name: iPhoneBackupStudio-macOS-x86_64
          - os: windows-latest
            arch: x64
            artifact_name: iPhoneBackupStudio-Windows-x64
          - os: ubuntu-22.04
            arch: x64
            artifact_name: iPhoneBackupStudio-Linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux System Dependencies (usbmuxd & Qt6 XCB)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y usbmuxd libimobiledevice6 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements.txt

      - name: Build Standalone Bundle with PyInstaller
        working-directory: packaging
        run: |
          pyinstaller iphone_backup_studio.spec --noconfirm

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packaging/dist/
